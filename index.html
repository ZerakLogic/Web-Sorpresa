<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Una pregunta importante</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100dvh;
            background: radial-gradient(circle at 50% 20%, #26264f 0%, #1a1a2e 60%, #12121f 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            text-align: center;
            overflow: hidden;
            position: relative;
            touch-action: manipulation;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 2.5rem;
            padding: 0 24px;
            max-width: 480px;
            line-height: 1.4;
            color: #f1f1f8;
            animation: fadeIn 0.8s ease both;
        }

        .botones {
            position: relative;
            width: 100%;
            height: 220px;
        }

        button {
            padding: 16px 38px;
            font-size: 1.15rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1),
                        left 0.35s cubic-bezier(.22,1,.36,1),
                        top 0.35s cubic-bezier(.22,1,.36,1),
                        box-shadow 0.25s ease;
            will-change: transform, left, top;
            user-select: none;
        }

        button:active { transform: scale(0.95); }

        #btn-si {
            background: linear-gradient(135deg, #ff5277, #e94560);
            color: white;
            position: relative;
            z-index: 2;
        }
        #btn-si:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(233,69,96,0.5);
        }

        #btn-no {
            background: linear-gradient(135deg, #6a4fc4, #533483);
            color: white;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 70px;
            z-index: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .celebracion {
            animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1) both;
        }
    </style>
</head>
<body>

    <h1 id="mensaje">¿Te gustaría salir a tomar algo conmigo esta semana? ☕</h1>

    <div class="botones">
        <button id="btn-si" onclick="aceptar()">Sí, me encantaría</button>
        <button id="btn-no">No creo</button>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        const mensaje = document.getElementById('mensaje');
        let moviendo = false;

        function moverBoton() {
            if (moviendo) return; // evita doble disparo touch + mouse en el mismo gesto
            moviendo = true;

            const rect = btnNo.getBoundingClientRect();
            const w = rect.width || 150;
            const h = rect.height || 60;

            const margen = 10;
            const maxX = Math.max(margen, window.innerWidth - w - margen);
            const maxY = Math.max(margen, window.innerHeight - h - margen);

            const randomX = Math.floor(Math.random() * (maxX - margen)) + margen;
            const randomY = Math.floor(Math.random() * (maxY - margen)) + margen;

            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
            btnNo.style.margin = '0';
            btnNo.style.transform = 'none';

            // Libera el "lock" después de que termine la transición,
            // para permitir el siguiente intento de toque/click sin duplicar eventos.
            setTimeout(() => { moviendo = false; }, 120);
        }

        // Touch: se usa { passive: false } para poder llamar preventDefault()
        // y evitar que dispare también el evento "mouseover"/"click" fantasma en iOS/Android.
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moverBoton();
        }, { passive: false });

        // Mouse/desktop
        btnNo.addEventListener('mouseover', moverBoton);

        // Por si algún dispositivo dispara "click" directo sin mouseover/touchstart previos
        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            moverBoton();
        });

        function aceptar() {
            mensaje.innerHTML = "¡Sabía que dirías que sí! 🚀<br>Yo invito.";
            mensaje.classList.add('celebracion');
            document.querySelector('.botones').style.display = 'none';
        }
    </script>
</body>
</html>
