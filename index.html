<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Una pregunta importante</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #1a1a2e;
            color: #e94560;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        h1 { font-size: 1.8rem; margin-bottom: 2rem; padding: 0 20px; }
        .botones { position: relative; width: 100%; height: 200px; }
        button {
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        #btn-si { background-color: #e94560; color: white; position: relative; z-index: 2; }
        #btn-no { background-color: #533483; color: white; position: absolute; left: 50%; transform: translateX(-50%); margin-top: 70px; z-index: 1; }
    </style>
</head>
<body>

    <h1 id="mensaje">¿Te gustaría salir a tomar algo conmigo esta semana? ☕</h1>
    
    <div class="botones">
        <button id="btn-si" onclick="aceptar()">Sí, me encantaría</button>
        <button id="btn-no">No creo</button>
    </div>

    <script>
        const btnNo = document.getElementById('btn-no');
        
        // Optimizado para toques en la pantalla del celular
        btnNo.addEventListener('touchstart', moverBoton);
        btnNo.addEventListener('mouseover', moverBoton);

        function moverBoton(e) {
            e.preventDefault();
            // Calcula coordenadas aleatorias dentro de la pantalla
            const randomX = Math.floor(Math.random() * (window.innerWidth - 150));
            const randomY = Math.floor(Math.random() * (window.innerHeight - 150));
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
            btnNo.style.transform = 'none';
        }

        function aceptar() {
            document.getElementById('mensaje').innerHTML = "¡Sabía que dirías que sí! 🚀<br>Yo invito.";
            document.querySelector('.botones').style.display = 'none';
        }
    </script>
</body>
    
</html>
